services:
  postgres:
    image: postgres:17-alpine
    container_name: gear-book-postgres

    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: gearbook
      POSTGRES_PASSWORD: gearbook

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  booking-postgres:
    image: postgres:17-alpine
    container_name: gear-book-booking-postgres

    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: gearbook_booking
      POSTGRES_PASSWORD: gearbook_booking

    ports:
      - "5434:5432"

    volumes:
      - booking_postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  booking_postgres_data:
