services:
  postgres:
    image: postgres:17-alpine
    container_name: gear-book-postgres

    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: gearbook
      POSTGRES_PASSWORD: gearbook

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
